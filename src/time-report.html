<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Time Reports</title>
  <!-- Theme follows the Azure DevOps host (see applyDevOpsTheme); default is light, never the OS setting -->
  <script src="../lib/VSS.SDK.min.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="time-report.css">
  <script src="time-core.js"></script>
</head>
<body>
  <div class="filters">
    <div class="filter-group">
      <label for="dateFrom">From Date</label>
      <input type="date" id="dateFrom">
    </div>
    <div class="filter-group">
      <label for="dateTo">To Date</label>
      <input type="date" id="dateTo">
    </div>
    <div class="filter-group">
      <label>User</label>
      <div class="ms" id="userFilter" data-all="All Users"></div>
    </div>
    <div class="filter-group">
      <label>Epic</label>
      <div class="ms" id="epicFilter" data-all="All Epics"></div>
    </div>
    <div class="filter-group">
      <label>Project</label>
      <div class="ms" id="projectFilter" data-all="All Projects"></div>
    </div>
    <div class="filter-group">
      <label>Client</label>
      <div class="ms" id="clientFilter" data-all="All Clients"></div>
    </div>
    <div class="filter-group">
      <label>Tag</label>
      <div class="ms" id="tagFilter" data-all="All Tags"></div>
    </div>
    <div class="btn-group">
      <button class="icon-btn toolbar-btn" onclick="clearFilters()" title="Clear filters" aria-label="Clear filters">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon><line x1="16" y1="16" x2="22" y2="22"></line><line x1="22" y1="16" x2="16" y2="22"></line></svg>
      </button>
      <button class="icon-btn toolbar-btn" onclick="exportCSV()" title="Export CSV" aria-label="Export CSV">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button class="icon-btn toolbar-btn" onclick="exportBackupJSON()" title="Backup JSON" aria-label="Backup JSON">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
      </button>
      <button id="resyncBtn" class="icon-btn toolbar-btn resync-btn" onclick="resyncAll()" title="Re-sync tags, parent, epic, project and client from Azure DevOps (admin)" aria-label="Re-sync" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        <span id="resyncProgress"></span>
      </button>
    </div>
    <div class="filters-add">
      <button class="add-entry-btn" onclick="openAddEntry()" title="Add a new time entry">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Entry
      </button>
    </div>
  </div>

  <div class="summary-cards" id="summaryCards">
    <div class="summary-card">
      <h3>Total Hours</h3>
      <div class="value" id="totalHours">0<small>h</small></div>
    </div>
    <div class="summary-card">
      <h3>Entries</h3>
      <div class="value" id="totalEntries">0</div>
    </div>
    <div class="summary-card">
      <h3>Users</h3>
      <div class="value" id="totalUsers">0</div>
    </div>
    <div class="summary-card">
      <h3>Work Items</h3>
      <div class="value" id="totalWorkItems">0</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="entries" onclick="switchView('entries')">All Entries</div>
    <div class="tab" data-view="byUser" onclick="switchView('byUser')">By User</div>
    <div class="tab" data-view="byEpic" onclick="switchView('byEpic')">By Epic</div>
    <div class="tab" data-view="byProject" onclick="switchView('byProject')">By Project</div>
    <div class="tab" data-view="byClient" onclick="switchView('byClient')">By Client</div>
    <div class="tab" data-view="byTag" onclick="switchView('byTag')">By Tag</div>
    <div class="tab" data-view="monthlyReport" onclick="switchView('monthlyReport')">Monthly Report</div>
  </div>

  <div class="results-table">
    <div id="loading" class="loading">Loading...</div>
    <table id="resultsTable" style="display: none;">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="noData" class="no-data" style="display: none;">No time entries found matching your filters.</div>
  </div>

  <script>
    function applyDevOpsTheme() {
      function applyIfExplicit(t) {
        if (!t) return false;
        var theme = String(t).toLowerCase();
        if (theme.indexOf('dark') !== -1) {
          document.documentElement.classList.add('dark');
          return true;
        }
        // Known Azure DevOps light/default themes should map to light, but
        // unrecognized non-empty values must fall through to the existing
        // detection cascade rather than forcing light.
        if (theme === 'default' || theme === 'light') {
          document.documentElement.classList.remove('dark');
          return true;
        }
        return false;
      }
      var t = '';
      try { if (typeof VSS.getPageContext === 'function') t = (VSS.getPageContext().globalization.theme || '').toLowerCase(); } catch(e) {}
      try { if (!t && window.__vssPageContext) t = ((window.__vssPageContext.globalization || {}).theme || '').toLowerCase(); } catch(e) {}
      try { if (!t && window._pageContext)     t = ((window._pageContext.globalization     || {}).theme || '').toLowerCase(); } catch(e) {}
      if (applyIfExplicit(t)) return;
      // On-premise Azure DevOps Server is same-origin — read the host page background
      // as the ground truth for the active theme. Cross-origin throws; caught silently.
      try {
        if (window.top !== window) {
          var rgb = window.top.getComputedStyle(window.top.document.body).backgroundColor;
          var m = rgb.match(/\d+/g);
          if (m && m.length >= 3) {
            var lum = (+m[0] * 299 + +m[1] * 587 + +m[2] * 114) / 1000;
            if (lum < 128) document.documentElement.classList.add('dark');
            else           document.documentElement.classList.remove('dark');
            return;
          }
        }
      } catch(e) {}
      try {
        VSS.require(['VSS/Context'], function(Ctx) {
          try { applyIfExplicit(((Ctx.getPageContext().globalization || {}).theme || '').toLowerCase()); } catch(e) {}
        });
      } catch(e) {}
    }

    console.log("[TimeReport] Script started");
    const STORAGE_KEY_PREFIX = "timetracker_";
    const LEGACY_STORAGE_KEY = "timetracker_entries";
    let allEntries = [];
    let filteredEntries = [];
    let currentView = "entries";
    var pendingFilters = null;
    let currentUser = null;
    var collectionUri = "";
    var currentProjectName = "";
    var TC = window.TimeCore;
    var EDIT_ICON = TC.EDIT_ICON;
    var DELETE_ICON = TC.DELETE_ICON;
    var escapeHtml = TC.escapeHtml;
    var _witClient = null;

    function getWitClient() {
      if (_witClient) return Promise.resolve(_witClient);
      return new Promise(function(resolve) {
        VSS.require(['VSS/Service', 'TFS/WorkItemTracking/RestClient'], function(VSS_Service, WIT_Client) {
          _witClient = VSS_Service.getCollectionClient(WIT_Client.WorkItemTrackingHttpClient);
          resolve(_witClient);
        });
      });
    }

    var checkIsAdmin = TC.checkIsAdmin;

    function fetchTagsForWorkItem(witClient, workItemId, fieldRefs) {
      return witClient.getWorkItem(workItemId, null, null, 4).then(function(wi) {
        var meta = {
          workItemTitle: wi.fields['System.Title'],
          tags: wi.fields['System.Tags'] || '',
          parentId: wi.fields['System.Parent'] || null,
          parentTitle: null,
          parentType: null,
          epicId: null,
          epicTitle: null
        };
        return TC.resolveAncestry(witClient, wi).then(function(anc) {
          meta.parentTitle = anc.parentTitle;
          meta.parentType = anc.parentType;
          meta.epicId = anc.epicId;
          meta.epicTitle = anc.epicTitle;
          meta.ancestorIds = anc.ancestors.map(function(item) { return item.id; });
          anc.ancestors.forEach(function(item) {
            if (item.fields['System.Tags']) {
              meta.tags = TC.mergeTags(meta.tags, item.fields['System.Tags']);
            }
          });
          return Object.assign(meta, TC.resolveProjectClient(wi, anc, fieldRefs));
        });
      });
    }

    function batchUpdateEntries(entryUpdates) {
      var byKey = {};
      entryUpdates.forEach(function(u) {
        var key = TC.getStorageKeyForDate(u.date);
        if (!byKey[key]) byKey[key] = [];
        byKey[key].push(u);
      });
      return Promise.all(Object.keys(byKey).map(function(key) {
        var updates = byKey[key];
        return window.dataService.getValue(key, { scopeType: 'Default' }).then(function(data) {
          var monthEntries = data || [];
          var updById = {};
          updates.forEach(function(u) { updById[u.id] = u.updates; });
          var updated = monthEntries.map(function(e) {
            return updById[e.id] ? Object.assign({}, e, updById[e.id]) : e;
          });
          return window.dataService.setValue(key, updated, { scopeType: 'Default' });
        });
      }));
    }

    function resyncAll() {
      if (filteredEntries.length === 0) {
        alert('No entries in current filter to update.');
        return;
      }
      // Deduplicate by workItemId — fetch each work item once
      var byWorkItem = {};
      filteredEntries.forEach(function(e) {
        if (!byWorkItem[e.workItemId]) byWorkItem[e.workItemId] = [];
        byWorkItem[e.workItemId].push(e);
      });
      var workItemIds = Object.keys(byWorkItem);
      var total = workItemIds.length;
      var failed = [];

      if (!confirm('Re-sync tags, parent, epic, project and client for ' + filteredEntries.length + ' filtered entries (' + total + ' unique work items) from Azure DevOps?')) return;

      var btn = document.getElementById('resyncBtn');
      var progress = document.getElementById('resyncProgress');
      btn.disabled = true;
      var done = 0;
      var entryUpdates = [];
      var metaByWorkItem = {};

      Promise.all([getWitClient(), TC.getSettings(window.dataService)]).then(function(results) {
        var witClient = results[0];
        var fieldRefs = TC.fieldRefsFromSettings(results[1]);
        function processBatch(ids) {
          if (ids.length === 0) return Promise.resolve();
          var batch = ids.slice(0, 5);
          var rest = ids.slice(5);
          return Promise.all(batch.map(function(wiId) {
            return fetchTagsForWorkItem(witClient, wiId, fieldRefs).then(function(meta) {
              metaByWorkItem[wiId] = meta;
              byWorkItem[wiId].forEach(function(e) {
                entryUpdates.push({ id: e.id, date: e.date, updates: meta });
              });
            }).catch(function(err) {
              console.warn('[TimeReport] Re-sync failed for work item ' + wiId, err);
              failed.push(wiId);
            }).then(function() {
              done++;
              progress.textContent = done + '/' + total;
            });
          })).then(function() { return processBatch(rest); });
        }

        progress.textContent = '0/' + total;
        return processBatch(workItemIds).then(function() {
          return batchUpdateEntries(entryUpdates);
        }).then(function() {
          // Recompute total-hours (if configured) for every work item this
          // resync touched, using the freshly-resynced ancestor chains —
          // this is the explicit "fix everything now" path for hours stuck
          // on a work item after it was re-parented in Azure DevOps.
          var touchedEntries = [];
          workItemIds.forEach(function(wiId) {
            var meta = metaByWorkItem[wiId];
            if (!meta) return;
            byWorkItem[wiId].forEach(function(e) {
              touchedEntries.push(Object.assign({}, e, meta));
            });
          });
          return TC.recalcTotalHours(window.dataService, witClient, touchedEntries);
        }).then(function(totalFailures) {
          btn.disabled = false;
          progress.textContent = '';
          var msg = 'Re-synced ' + entryUpdates.length + ' of ' + filteredEntries.length + ' entries (' + (total - failed.length) + '/' + total + ' work items).';
          if (failed.length) msg += '\n\nCould not fetch work items (deleted or no access?): ' + failed.join(', ');
          if (totalFailures && totalFailures.length) {
            msg += '\n\nCould not update the total-hours field on:\n' + totalFailures.map(function(f) {
              return '#' + f.id + ': ' + f.message;
            }).join('\n');
          }
          alert(msg);
          return loadAllEntries();
        });
      }).catch(function(err) {
        btn.disabled = false;
        progress.textContent = '';
        alert('Re-sync failed: ' + err.message);
      });
    }

    function openAddEntry() {
      var seen = {}, recent = [];
      // Build recent list from current user's entries, newest first.
      allEntries.filter(function(e) {
        return currentUser && String(e.userId) === String(currentUser.id);
      }).slice().sort(function(a, b) {
        return b.date > a.date ? -1 : b.date < a.date ? 1 : 0;
      }).forEach(function(e) {
        var k = String(e.workItemId);
        if (!seen[k]) { seen[k] = true; recent.push({ id: e.workItemId, title: e.workItemTitle || '(untitled)', type: null }); }
      });
      TC.openAddEntryModal({
        dataService: window.dataService,
        witClientGetter: getWitClient,
        currentUser: currentUser,
        projectName: currentProjectName,
        recentItems: recent.slice(0, 20),
        onSaved: function() { loadAllEntries(); }
      });
    }

    function parseHashString(hash) {
      if (!hash) return null;
      // Values stay encoded here: multi-select filters are a comma-joined
      // list of individually encoded values, so split before decoding.
      var raw = {};
      hash.split("&").forEach(function(pair) {
        var idx = pair.indexOf("=");
        if (idx > 0) raw[decodeURIComponent(pair.slice(0, idx))] = pair.slice(idx + 1);
      });
      if (!Object.keys(raw).length) return null;
      function list(v) { return v.split(",").filter(Boolean).map(decodeURIComponent); }
      // Map URL-friendly names to internal filter keys
      var params = {};
      if (raw.startdate) params.dateFrom = decodeURIComponent(raw.startdate);
      if (raw.enddate)   params.dateTo   = decodeURIComponent(raw.enddate);
      ["user", "epic", "project", "client", "tag"].forEach(function(k) {
        if (raw[k]) params[k] = list(raw[k]);
      });
      return Object.keys(params).length ? params : null;
    }

    function writeHashFilters() {
      var parts = [];
      var dateFrom = document.getElementById("dateFrom").value;
      var dateTo   = document.getElementById("dateTo").value;
      if (dateFrom) parts.push("startdate=" + encodeURIComponent(dateFrom));
      if (dateTo)   parts.push("enddate="   + encodeURIComponent(dateTo));
      [["userFilter","user"],["epicFilter","epic"],["projectFilter","project"],["clientFilter","client"],["tagFilter","tag"]].forEach(function(pair) {
        var v = msGetValues(pair[0]);
        if (v === null) { if (pair[1] === "user") parts.push("user=*"); }
        else if (v.length) parts.push(pair[1] + "=" + v.map(encodeURIComponent).join(","));
      });
      var hashStr = parts.join("&");
      VSS.getService(VSS.ServiceIds.Navigation).then(function(nav) {
        nav.setHash(hashStr);
      });
    }

    // Get all months between two dates
    function getMonthsBetween(startDate, endDate) {
      var months = [];
      var current = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
      var end = new Date(endDate.getFullYear(), endDate.getMonth(), 1);

      while (current <= end) {
        months.push(new Date(current));
        current.setMonth(current.getMonth() + 1);
      }

      return months;
    }

    // Wait for VSS SDK to be available
    function initializeExtension() {
      console.log("[TimeReport] Checking for VSS...", typeof VSS);
      if (typeof VSS === "undefined") {
        setTimeout(initializeExtension, 50);
        return;
      }

      console.log("[TimeReport] VSS found, initializing...");
      try {
        VSS.init({
          explicitNotifyLoaded: true,
          usePlatformScripts: true
        });
        applyDevOpsTheme();
      } catch (err) {
        console.error("[TimeReport] VSS.init failed:", err);
        return;
      }

      console.log("[TimeReport] Waiting for VSS.ready...");
      VSS.ready(function() {
        console.log("[TimeReport] VSS.ready callback fired");
        try {
          VSS.getService(VSS.ServiceIds.ExtensionData).then(function(dataService) {
            console.log("[TimeReport] Got extension data service");
            window.dataService = dataService;
            try {
              var ctx = VSS.getWebContext();
              currentUser = ctx.user;
              collectionUri = ((ctx.collection || {}).uri || "").replace(/\/$/, "");
              currentProjectName = (ctx.project || {}).name || "";
              checkIsAdmin().then(function(admin) {
                if (admin) document.getElementById('resyncBtn').style.display = '';
              });
            } catch(e) {}
            try { dataService.setValue('user-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light', { scopeType: 'User' }); } catch(e) {}

            setDefaultDateRange();

            console.log("[TimeReport] Running migration check...");
            function startLoad() {
              migrateLegacyData().then(function() {
                console.log("[TimeReport] Migration check complete, loading entries...");
                loadAllEntries();
                console.log("[TimeReport] Notifying load succeeded");
                VSS.notifyLoadSucceeded();
              });
            }

            VSS.getService(VSS.ServiceIds.Navigation).then(function(nav) {
              nav.getHash().then(function(hash) {
                var hashFilters = parseHashString(hash);
                if (hashFilters) {
                  if (hashFilters.dateFrom) document.getElementById("dateFrom").value = hashFilters.dateFrom;
                  if (hashFilters.dateTo)   document.getElementById("dateTo").value   = hashFilters.dateTo;
                  pendingFilters = hashFilters;
                }
                pendingFilters = pendingFilters || {};
                if (pendingFilters.user === undefined) pendingFilters.user = defaultUserSelection();
                startLoad();
              }, startLoad);
            }, startLoad);
          }, function(err) {
            console.error("[TimeReport] Failed to get extension data service:", err);
          });
        } catch (err) {
          console.error("[TimeReport] Error in VSS.ready:", err);
        }
      });
    }

    // Default user filter: the logged-in user
    function defaultUserSelection() {
      return currentUser ? [String(currentUser.id)] : null;
    }

    // Default date range: current week (Mon..Sun)
    function setDefaultDateRange() {
      var week = TC.weekDates();
      document.getElementById("dateFrom").value = week[0];
      document.getElementById("dateTo").value = week[6];
    }

    // Filters apply immediately. Dates change which months are loaded,
    // so they reload; the dropdowns filter the already-loaded entries.
    ["dateFrom", "dateTo"].forEach(function(id) {
      document.getElementById(id).addEventListener("change", function() {
        if (window.dataService) loadAllEntries();
      });
    });
    ["userFilter", "epicFilter", "projectFilter", "clientFilter", "tagFilter"].forEach(function(id) {
      msInit(id, applyFilters);
    });

    // ---- Multi-select dropdown -------------------------------------
    // <div class="ms" id="..." data-all="All X"></div>.
    // selected === null means all (every box ticked, no filtering);
    // otherwise it is the explicit set of ticked values (may be empty).
    function msInit(id, onChange) {
      var root = document.getElementById(id);
      root.innerHTML = '<div class="ms-trigger" tabindex="0"></div><div class="ms-panel"></div>';
      root._ms = { options: [], selected: null, onChange: onChange };
      var trigger = root.querySelector(".ms-trigger");
      trigger.addEventListener("click", function() { msToggle(root); });
      trigger.addEventListener("keydown", function(ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); msToggle(root); }
        if (ev.key === "Escape") root.classList.remove("open");
      });
      root.querySelector(".ms-panel").addEventListener("change", function(ev) {
        var cb = ev.target, st = root._ms;
        if (cb.dataset.all !== undefined) {
          st.selected = cb.checked ? null : {};
        } else {
          if (st.selected === null) {
            st.selected = {};
            st.options.forEach(function(o) { st.selected[o.value] = true; });
          }
          if (cb.checked) st.selected[cb.value] = true;
          else delete st.selected[cb.value];
          msNormalize(st);
        }
        msRender(root);
        root._ms.onChange();
      });
      msRender(root);
    }

    function msToggle(root) {
      var wasOpen = root.classList.contains("open");
      document.querySelectorAll(".ms.open").forEach(function(el) { el.classList.remove("open"); });
      if (!wasOpen) root.classList.add("open");
    }

    document.addEventListener("click", function(ev) {
      document.querySelectorAll(".ms.open").forEach(function(el) {
        if (!el.contains(ev.target)) el.classList.remove("open");
      });
    });

    // Every option ticked is the same as "all".
    function msNormalize(st) {
      if (st.selected && st.options.length && st.options.every(function(o) { return st.selected[o.value]; })) {
        st.selected = null;
      }
    }

    // options: [{value, label}]; selectedValues: array, or null / ["*"] for all.
    // Values not in options are dropped; if none survive it falls back to all.
    function msSetOptions(id, options, selectedValues) {
      var st = document.getElementById(id)._ms;
      var valid = {};
      options.forEach(function(o) { valid[o.value] = true; });
      st.options = options;
      if (!selectedValues || selectedValues[0] === "*") {
        st.selected = null;
      } else {
        st.selected = {};
        selectedValues.forEach(function(v) { if (valid[v]) st.selected[v] = true; });
        if (selectedValues.length && !Object.keys(st.selected).length) st.selected = null;
        msNormalize(st);
      }
      msRender(document.getElementById(id));
    }

    // null = all; otherwise array of ticked values (may be empty).
    function msGetValues(id) {
      var sel = document.getElementById(id)._ms.selected;
      return sel === null ? null : Object.keys(sel);
    }

    function msRender(root) {
      var st = root._ms;
      var all = st.selected === null;
      var values = all ? [] : Object.keys(st.selected);
      var label = root.dataset.all;
      if (!all && values.length === 0) {
        label = "None";
      } else if (values.length === 1) {
        var opt = st.options.find(function(o) { return o.value === values[0]; });
        label = opt ? opt.label : values[0];
      } else if (values.length > 1) {
        label = values.length + " selected";
      }
      var trigger = root.querySelector(".ms-trigger");
      trigger.textContent = label;
      trigger.title = values.length > 1
        ? st.options.filter(function(o) { return st.selected[o.value]; }).map(function(o) { return o.label; }).join(", ")
        : label;
      root.querySelector(".ms-panel").innerHTML =
        '<label class="ms-option ms-all"><input type="checkbox" data-all' + (all ? ' checked' : '') + '> ' + escapeHtml(root.dataset.all) + '</label>' +
        st.options.map(function(o) {
          return '<label class="ms-option"><input type="checkbox" value="' + escapeHtml(o.value).replace(/"/g, "&quot;") + '"' +
            (all || st.selected[o.value] ? ' checked' : '') + '> ' + escapeHtml(o.label) + '</label>';
        }).join("");
    }

    // Start initialization
    initializeExtension();

    // Migrate legacy data from single document to monthly partitions
    function migrateLegacyData() {
      return window.dataService.getValue(LEGACY_STORAGE_KEY, { scopeType: "Default" }).then(function(legacyData) {
        if (!legacyData || legacyData.length === 0) {
          console.log("[TimeReport] No legacy data to migrate");
          return Promise.resolve();
        }

        console.log("[TimeReport] Migrating " + legacyData.length + " legacy entries...");

        // Group entries by month
        var entriesByMonth = {};
        legacyData.forEach(function(entry) {
          var key = getStorageKeyForDate(entry.date);
          if (!entriesByMonth[key]) {
            entriesByMonth[key] = [];
          }
          entriesByMonth[key].push(entry);
        });

        // Save each month's entries
        var promises = Object.keys(entriesByMonth).map(function(key) {
          return window.dataService.setValue(key, entriesByMonth[key], { scopeType: "Default" });
        });

        // After migration, delete legacy data
        return Promise.all(promises).then(function() {
          console.log("[TimeReport] Migration complete, deleting legacy data");
          return window.dataService.setValue(LEGACY_STORAGE_KEY, null, { scopeType: "Default" });
        });
      }, function(err) {
        console.log("[TimeReport] No legacy data found");
        return Promise.resolve();
      });
    }

    // Get entries for a specific month
    function getEntriesForMonth(storageKey) {
      return window.dataService.getValue(storageKey, { scopeType: "Default" }).then(function(data) {
        console.log("[TimeReport] Loaded " + (data ? data.length : 0) + " entries from " + storageKey);
        return data || [];
      }, function(err) {
        console.log("[TimeReport] No data found for " + storageKey);
        return [];
      });
    }

    function loadAllEntries() {
      document.getElementById("loading").style.display = "block";
      document.getElementById("resultsTable").style.display = "none";
      document.getElementById("noData").style.display = "none";

      // Get date range from filters (or use defaults)
      var dateFrom = document.getElementById("dateFrom").value;
      var dateTo = document.getElementById("dateTo").value;

      var startDate, endDate;
      if (dateFrom && dateTo) {
        startDate = new Date(dateFrom);
        endDate = new Date(dateTo);
      } else {
        // Default: load last 12 months
        endDate = new Date();
        startDate = new Date();
        startDate.setMonth(startDate.getMonth() - 12);
      }

      // Get all months in the range
      var months = getMonthsBetween(startDate, endDate);
      console.log("[TimeReport] Loading " + months.length + " months of data");

      // Load entries for each month
      var promises = months.map(function(month) {
        // Generate key directly from date object to avoid timezone issues
        var year = month.getFullYear();
        var monthNum = String(month.getMonth() + 1).padStart(2, '0');
        var key = STORAGE_KEY_PREFIX + year + "_" + monthNum;
        return getEntriesForMonth(key);
      });

      Promise.all([Promise.all(promises), TC.refreshEditCutoff(window.dataService)]).then(function(res) {
        var results = res[0];
        allEntries = [];
        results.forEach(function(monthEntries) {
          allEntries = allEntries.concat(monthEntries);
        });
        console.log("[TimeReport] Loaded total of " + allEntries.length + " entries");
        populateFilters();
        applyFilters();
      }, function(err) {
        console.error("[TimeReport] Error loading entries:", err);
        allEntries = [];
        populateFilters();
        applyFilters();
      });
    }

    function populateFilters() {
      // Keep current selections (use pendingFilters from hash on first load)
      var pf = pendingFilters;
      pendingFilters = null;
      function saved(key, id) { return pf && pf[key] !== undefined ? pf[key] : msGetValues(id); }
      function setGroup(id, options, key, visible) {
        msSetOptions(id, options, saved(key, id));
        document.getElementById(id).closest('.filter-group').style.display = visible ? '' : 'none';
      }
      function plain(v) { return { value: v, label: v }; }

      // Unique users
      var users = {};
      if (currentUser) users[currentUser.id] = currentUser.name;
      allEntries.forEach(function(e) { if (!users[e.userId]) users[e.userId] = e.userName; });
      var userOpts = Object.keys(users).map(function(id) { return { value: id, label: users[id] }; })
        .sort(function(a, b) { return String(a.label).localeCompare(String(b.label)); });
      setGroup("userFilter", userOpts, "user", userOpts.length > 1);

      // Unique epics
      var epics = {};
      allEntries.forEach(function(e) { if (e.epicId && !epics[e.epicId]) epics[e.epicId] = e.epicTitle; });
      var epicOpts = Object.keys(epics).map(function(id) { return { value: id, label: epics[id] || ('#' + id) }; })
        .sort(function(a, b) { return String(a.label).localeCompare(String(b.label)); });
      setGroup("epicFilter", epicOpts, "epic", epicOpts.length > 0);

      // Unique projects
      var projects = [...new Set(allEntries.map(e => e.project || "(No Project)"))].sort();
      setGroup("projectFilter", projects.map(plain), "project", projects.some(function(p) { return p !== '(No Project)'; }));

      // Unique clients
      var clients = [...new Set(allEntries.map(e => e.client || "(No Client)"))].sort();
      setGroup("clientFilter", clients.map(plain), "client", clients.some(function(c) { return c !== '(No Client)'; }));

      // Unique tags
      var allTags = new Set();
      allEntries.forEach(function(e) {
        if (e.tags) {
          e.tags.split(";").forEach(function(t) {
            var tag = t.trim();
            if (tag) allTags.add(tag);
          });
        }
      });
      setGroup("tagFilter", [...allTags].sort().map(plain), "tag", allTags.size > 0);
    }

    function applyFilters() {
      var dateFrom = document.getElementById("dateFrom").value;
      var dateTo = document.getElementById("dateTo").value;
      function set(id) {
        var v = msGetValues(id);
        if (v === null) return null;
        var s = {};
        v.forEach(function(x) { s[x] = true; });
        return s;
      }
      var users = set("userFilter");
      var epics = set("epicFilter");
      var projects = set("projectFilter");
      var clients = set("clientFilter");
      var tagValues = msGetValues("tagFilter");
      var tags = tagValues && tagValues.map(function(t) { return t.toLowerCase(); });

      filteredEntries = allEntries.filter(function(e) {
        if (dateFrom && e.date < dateFrom) return false;
        if (dateTo && e.date > dateTo) return false;
        if (users && !users[e.userId]) return false;
        if (epics && !epics[String(e.epicId)]) return false;
        if (projects && !projects[e.project || "(No Project)"]) return false;
        if (clients && !clients[e.client || "(No Client)"]) return false;
        if (tags) {
          var entryTags = (e.tags || "").split(";").map(function(t) { return t.trim().toLowerCase(); });
          if (!tags.some(function(t) { return entryTags.indexOf(t) !== -1; })) return false;
        }
        return true;
      });

      updateSummary();
      renderView();
      writeHashFilters();
    }

    function clearFilters() {
      setDefaultDateRange();
      ["epicFilter", "projectFilter", "clientFilter", "tagFilter"].forEach(function(id) {

      document.getElementById("totalEntries").textContent = filteredEntries.length;
      document.getElementById("totalUsers").textContent = uniqueUsers;
      document.getElementById("totalWorkItems").textContent = uniqueWorkItems;

    function renderMonthlyReportView() {
      var thead = document.getElementById("tableHead");
      var tbody = document.getElementById("tableBody");

      // Get unique users
      var users = {};
      filteredEntries.forEach(function(e) {
        if (!users[e.userId]) {
          users[e.userId] = e.userName;
        }
      });
      var userIds = Object.keys(users).sort(function(a, b) {
        return users[a].localeCompare(users[b]);
      });

      // Group by User Story (parent) if available, otherwise by work item
      var grouped = {};
      filteredEntries.forEach(function(e) {
        // Use parent (User Story/Feature) as the grouping key if available
        var hasParent = e.parentId && e.parentTitle && e.parentType !== "Epic";
        var key = hasParent ? e.parentId : e.workItemId;
        var title = hasParent ? e.parentTitle : e.workItemTitle;
        var itemType = hasParent ? e.parentType : null;

        if (!grouped[key]) {
          grouped[key] = {
            project: e.project || "(No Project)",
            client: e.client || "(No Client)",
            workItemId: key,
            workItemTitle: title,
            workItemType: itemType,
            userHours: {}
          };
        }
        if (!grouped[key].userHours[e.userId]) {
          grouped[key].userHours[e.userId] = 0;
        }
        grouped[key].userHours[e.userId] += e.hours;
      });

      // Build header
      var headerCells = "<th>Project</th><th>Client</th><th>User Story ID</th><th>User Story Title</th>";
      userIds.forEach(function(userId) {
        headerCells += "<th>" + escapeHtml(users[userId]) + "</th>";
      });
      headerCells += "<th>Total</th>";
      thead.innerHTML = "<tr>" + headerCells + "</tr>";

      // Build rows
      var rows = Object.values(grouped).sort(function(a, b) {
        if (a.project !== b.project) return a.project.localeCompare(b.project);
        if (a.client !== b.client) return a.client.localeCompare(b.client);
        return a.workItemId - b.workItemId;
      });

      tbody.innerHTML = rows.map(function(r) {
        var userCells = "";
        var total = 0;
        userIds.forEach(function(userId) {
          var hours = r.userHours[userId] || 0;
          total += hours;
          userCells += "<td>" + (hours > 0 ? hours.toFixed(1) : "-") + "</td>";
        });

        return "<tr>" +
          "<td>" + escapeHtml(r.project) + "</td>" +
          "<td>" + escapeHtml(r.client) + "</td>" +
          "<td>#" + r.workItemId + "</td>" +
          "<td>" + escapeHtml(r.workItemTitle) + "</td>" +
          userCells +
          "<td><strong>" + total.toFixed(1) + "h</strong></td>" +
        "</tr>";
      }).join("");
    }

          '"' + r.name.replace(/"/g, '""') + '"',
          r.hours.toFixed(1),
          r.entries,
          r.users.size
        ].join(",");
      });
      return headers.join(",") + "\n" + rows.join("\n");
    }

    function exportByClientCSV() {
      var grouped = {};
      filteredEntries.forEach(function(e) {
        var clientName = e.client || "(No Client)";
        if (!grouped[clientName]) {
          grouped[clientName] = { name: clientName, hours: 0, entries: 0, users: new Set() };
        }
        grouped[clientName].hours += e.hours;
        grouped[clientName].entries++;
        grouped[clientName].users.add(e.userId);
      });

      var headers = ["Client", "Total Hours", "Entries", "Users"];
      var rows = Object.values(grouped).sort((a, b) => b.hours - a.hours).map(function(r) {
        return [
          '"' + r.name.replace(/"/g, '""') + '"',
          r.hours.toFixed(1),
          r.entries,
          r.users.size
        ].join(",");
      });
      return headers.join(",") + "\n" + rows.join("\n");
    }

    function exportByTagCSV() {
      var grouped = {};
      filteredEntries.forEach(function(e) {
        var tags = e.tags ? e.tags.split(";").map(t => t.trim()).filter(t => t) : ["(No Tags)"];
        tags.forEach(function(tag) {
          if (!grouped[tag]) {
            grouped[tag] = { name: tag, hours: 0, entries: 0, users: new Set() };
          }
          grouped[tag].hours += e.hours;
          grouped[tag].entries++;
          grouped[tag].users.add(e.userId);
        });
      });

      var headers = ["Tag", "Total Hours", "Entries", "Users"];
      var rows = Object.values(grouped).sort((a, b) => b.hours - a.hours).map(function(r) {
        return [
          '"' + r.name.replace(/"/g, '""') + '"',
          r.hours.toFixed(1),
          r.entries,
          r.users.size
        ].join(",");
      });
      return headers.join(",") + "\n" + rows.join("\n");
    }

    function exportMonthlyReportCSV() {
      // Get unique users
      var users = {};
      filteredEntries.forEach(function(e) {
        if (!users[e.userId]) {
          users[e.userId] = e.userName;
        }
      });
      var userIds = Object.keys(users).sort(function(a, b) {
        return users[a].localeCompare(users[b]);
      });

      // Group by User Story (parent) if available, otherwise by work item
      var grouped = {};
      filteredEntries.forEach(function(e) {
        // Use parent (User Story/Feature) as the grouping key if available
        var hasParent = e.parentId && e.parentTitle && e.parentType !== "Epic";
        var key = hasParent ? e.parentId : e.workItemId;
        var title = hasParent ? e.parentTitle : e.workItemTitle;

        if (!grouped[key]) {
          grouped[key] = {
            project: e.project || "(No Project)",
            client: e.client || "(No Client)",
            workItemId: key,
            workItemTitle: title,
            userHours: {}
          };
        }
        if (!grouped[key].userHours[e.userId]) {
          grouped[key].userHours[e.userId] = 0;
        }
        grouped[key].userHours[e.userId] += e.hours;
      });

      // Build headers
      var headers = ["Project", "Client", "User Story ID", "User Story Title"];
      userIds.forEach(function(userId) {
        headers.push(users[userId]);
      });
      headers.push("Total");

      // Build rows
      var rows = Object.values(grouped).sort(function(a, b) {
        if (a.project !== b.project) return a.project.localeCompare(b.project);
        if (a.client !== b.client) return a.client.localeCompare(b.client);
        return a.workItemId - b.workItemId;
      }).map(function(r) {
        var row = [
          '"' + r.project.replace(/"/g, '""') + '"',
          '"' + r.client.replace(/"/g, '""') + '"',
          r.workItemId,
          '"' + r.workItemTitle.replace(/"/g, '""') + '"'
        ];

        var total = 0;
        userIds.forEach(function(userId) {
          var hours = r.userHours[userId] || 0;
          total += hours;
          row.push(hours > 0 ? hours.toFixed(1) : "0");
        });
        row.push(total.toFixed(1));

        return row.join(",");
      });

      return headers.join(",") + "\n" + rows.join("\n");
    }

    function exportBackupJSON() {
      if (allEntries.length === 0) {
        alert("No data to backup");
        return;
      }

      var backup = {
        exportDate: new Date().toISOString(),
        exportVersion: "1.0",
        totalEntries: allEntries.length,
        entries: allEntries
      };

      var json = JSON.stringify(backup, null, 2);
      var blob = new Blob([json], { type: "application/json;charset=utf-8;" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "timetracker-backup-" + new Date().toISOString().split("T")[0] + ".json";
      link.click();
    }

    function getWorkItemUrl(entry) {
      var base = collectionUri.replace(/\/$/, "");
      var proj = entry.teamProject || currentProjectName || "";
      if (!base || !proj) return null;
      return base + "/" + encodeURIComponent(proj) + "/_workitems/edit/" + entry.workItemId;
    }

    function deleteEntry(entryId) {
      if (!confirm("Delete this time entry?")) return;
      var entry = allEntries.find(function(e) { return e.id === entryId; });
      if (!entry) { alert("Entry not found"); return; }
      if (!currentUser || entry.userId !== currentUser.id) { alert("You can only delete your own entries"); return; }
      getWitClient().then(function(client) {
        return TC.deleteEntryById(window.dataService, entryId, entry.date, client);
      }).then(function() {
        loadAllEntries();
      }, function() {
        alert("Failed to delete entry");
      });
    }

    function editEntry(entryId) {
      var entry = allEntries.find(function(e) { return e.id === entryId; });
      if (!entry) { alert('Entry not found'); return; }
      if (!currentUser || entry.userId !== currentUser.id) { alert('You can only edit your own entries'); return; }
      var seen = {}, recent = [];
      allEntries.filter(function(e) {
        return currentUser && String(e.userId) === String(currentUser.id);
      }).slice().sort(function(a, b) {
        return b.date > a.date ? -1 : b.date < a.date ? 1 : 0;
      }).forEach(function(e) {
        var k = String(e.workItemId);
        if (!seen[k]) { seen[k] = true; recent.push({ id: e.workItemId, title: e.workItemTitle || '(untitled)', type: null }); }
      });
      TC.openAddEntryModal({
        dataService: window.dataService,
        witClientGetter: getWitClient,
        currentUser: currentUser,
        projectName: currentProjectName,
        recentItems: recent.slice(0, 20),
        title: 'Edit Time Entry',
        saveLabel: 'Save',
        initialItem: { id: entry.workItemId, title: entry.workItemTitle || '(untitled)', type: null },
        initialHours: entry.hours,
        initialDate: entry.date,
        initialDesc: entry.description,
        entryId: entry.id,
        originalDate: entry.date,
        onSaved: function() { loadAllEntries(); }
      });
    }
  </script>
