<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Time Entry</title>
  <!-- Theme follows the Azure DevOps host (see applyDevOpsTheme) / saved user-theme; default is light, never the OS setting -->
  <script src="../lib/VSS.SDK.min.js"></script>
  <script src="time-core.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="time-entry.css">
</head>
<body>
  <div id="app">
    <div id="message" class="message" style="display: none;"></div>

    <!-- Gentle nudge banner when work item is closed without time -->
    <div id="nudgeBanner" class="nudge-banner">
      <div class="nudge-header">
        <div class="nudge-title">⏰ No time logged yet</div>
        <button class="nudge-close" onclick="dismissNudge()">×</button>
      </div>
      <div class="nudge-content">
        Hey, looks like this work item is being closed without any time logged. Want to add it real quick?
      </div>
      <div class="nudge-quick-add">
        <button class="nudge-btn" onclick="dismissNudge(); openLogTime()">Log Time</button>
        <button class="nudge-btn nudge-btn-secondary" onclick="dismissNudge()">Skip</button>
      </div>
    </div>

    <div class="time-entries">
      <div class="entries-header">
        <h3>Time Entries</h3>
        <!-- Hidden until applyEpicBlock() confirms logging is allowed here -->
        <button id="logTimeBtn" onclick="openLogTime()" style="display: none;">+ Log Time</button>
      </div>
      <div id="epicBlockedNote" class="message info" style="display: none;"></div>
      <div id="entriesList"></div>
      <div id="totalHours" class="total-hours" style="display: none;"></div>
    </div>
  </div>

  <script>
    function applyDevOpsTheme() {
      function applyIfExplicit(t) {
        if (!t) return false;
        // IMPORTANT — keep this simple toggle, do NOT copy the hub-page version here.
        //
        // This page runs as a sandboxed work-item-form contribution (cross-origin
        // iframe). VSS context theme values are unreliable in this context, so the
        // best-effort toggle below may be wrong. It does not matter: the async
        // dataService.getValue('user-theme') call further down always overwrites it
        // once it resolves. That async read is the real source of truth here.
        //
        // The hub-page version of applyIfExplicit returns false for unrecognised
        // theme strings, letting execution fall through to the luminance-based
        // parent-page background read. That fallback throws (cross-origin) in a
        // sandboxed iframe, causing a flash to the wrong theme. Always returning
        // true here prevents that fallback from running at all.
        document.documentElement.classList.toggle('dark', String(t).toLowerCase().indexOf('dark') !== -1);
        return true;
      }
      var t = '';
      try { if (typeof VSS.getPageContext === 'function') t = (VSS.getPageContext().globalization.theme || '').toLowerCase(); } catch(e) {}
      try { if (!t && window.__vssPageContext) t = ((window.__vssPageContext.globalization || {}).theme || '').toLowerCase(); } catch(e) {}
      try { if (!t && window._pageContext)     t = ((window._pageContext.globalization     || {}).theme || '').toLowerCase(); } catch(e) {}
      if (applyIfExplicit(t)) return;
      // On-premise Azure DevOps Server is same-origin — read the host page background
      // as the ground truth for the active theme. Cross-origin throws; caught silently.
      try {
        if (window.top !== window) {
          var rgb = window.top.getComputedStyle(window.top.document.body).backgroundColor;
          var m = rgb.match(/\d+/g);
          if (m && m.length >= 3) {
            var lum = (+m[0] * 299 + +m[1] * 587 + +m[2] * 114) / 1000;
            if (lum < 128) document.documentElement.classList.add('dark');
            else           document.documentElement.classList.remove('dark');
            return;
          }
        }
      } catch(e) {}
      try {
        VSS.require(['VSS/Context'], function(Ctx) {
          try { applyIfExplicit(((Ctx.getPageContext().globalization || {}).theme || '').toLowerCase()); } catch(e) {}
        });
      } catch(e) {}
    }

    console.log("[TimeTracker] Script started");
    let workItemId = null;
    let currentUser = null;
    const STORAGE_KEY_PREFIX = "timetracker_";
    const LEGACY_STORAGE_KEY = "timetracker_entries";
    var TC = window.TimeCore;
    var EDIT_ICON = TC.EDIT_ICON;
    var DELETE_ICON = TC.DELETE_ICON;
    var escapeHtml = TC.escapeHtml;
    var witClientCache = null;
    function getWitClient() {
      if (witClientCache) return Promise.resolve(witClientCache);
      return new Promise(function(resolve) {
        VSS.require(['VSS/Service', 'TFS/WorkItemTracking/RestClient'], function(VSS_Service, WIT_Client) {
          witClientCache = VSS_Service.getCollectionClient(WIT_Client.WorkItemTrackingHttpClient);
          resolve(witClientCache);
        });
      });
    }

    // Wait for VSS SDK to be available
    function initializeExtension() {
      console.log("[TimeTracker] Checking for VSS...", typeof VSS);
      if (typeof VSS === "undefined") {
        setTimeout(initializeExtension, 50);
        return;
      }

      console.log("[TimeTracker] VSS found, initializing...");
      try {
        VSS.init({
          explicitNotifyLoaded: true,
          usePlatformScripts: true
        });
        applyDevOpsTheme();
      } catch (err) {
        console.error("[TimeTracker] VSS.init failed:", err);
        return;
      }

      console.log("[TimeTracker] Waiting for VSS.ready...");
      VSS.ready(function() {
        try {
          // Get current user
          VSS.getService(VSS.ServiceIds.ExtensionData).then(function(dataService) {
            console.log("[TimeTracker] Got extension data service");
            window.dataService = dataService;
            // Theme detection is blocked in sandboxed work-item-form iframes.
            // Hub pages (time-report, settings) save the detected theme
            // to ExtensionData; read it here and apply it.
            dataService.getValue('user-theme', { scopeType: 'User' }).then(function(t) {
              if (t === 'dark')  document.documentElement.classList.add('dark');
              if (t === 'light') document.documentElement.classList.remove('dark');
            }, function() {});

            var webContext = VSS.getWebContext();
            currentUser = webContext.user;
            window.__projectName = webContext.project && webContext.project.name;
            console.log("[TimeTracker] Current user:", currentUser.name);

            // Register work item notification and field observer
            VSS.register(VSS.getContribution().id, function() {
              return {
                onLoaded: function(args) {
                  console.log("[TimeTracker] Work item loaded:", args.id);
                  workItemId = args.id;
                  loadTimeEntries();
                  applyEpicBlock();
                  setupFieldObserver();
                },
                onRefreshed: function(args) {
                  console.log("[TimeTracker] Work item refreshed:", args.id);
                  workItemId = args.id;
                  loadTimeEntries();
                  applyEpicBlock();
                },
                onFieldChanged: function(args) {
                  if (args.changedFields && args.changedFields["System.State"]) {
                    console.log("[TimeTracker] State changed to:", args.changedFields["System.State"]);
                    checkForTimeNudge(args.changedFields["System.State"]);
                  }
                }
              };
            });

            // Run migration on first load
            migrateLegacyData().then(function() {
              console.log("[TimeTracker] Migration check complete");
            });

            console.log("[TimeTracker] Notifying load succeeded");
            VSS.notifyLoadSucceeded();
          }, function(err) {
            console.error("[TimeTracker] Failed to get extension data service:", err);
          });
        } catch (err) {
          console.error("[TimeTracker] Error in VSS.ready:", err);
        }
      });
    }

    // Start initialization
    initializeExtension();

    // Shows the Log Time button only once it's confirmed that new time may be
    // logged on this work item (not an Epic while Settings blocks that),
    // so a slow load can't expose it. Existing entries stay listed and editable.
    var loggingBlocked = true;
    function applyEpicBlock() {
      var id = workItemId;
      if (!id) return; // unsaved new work item — nothing to log on yet
      getWitClient().then(function(c) {
        return TC.loggingBlockReason(window.dataService, c, id);
      }).catch(function() {
        return null; // unsaved new work item, or no access — don't block
      }).then(function(reason) {
        if (id !== workItemId) return;
        loggingBlocked = !!reason;
        var note = document.getElementById("epicBlockedNote");
        note.textContent = reason || "";
        note.style.display = reason ? "block" : "none";
        document.getElementById("logTimeBtn").style.display = reason ? "none" : "";
      });
    }

    function showMessage(text, type) {
      var msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = "message " + type;
      msg.style.display = "block";
      setTimeout(function() {
        msg.style.display = "none";
      }, 3000);
    }

    // Migrate legacy data from single document to monthly partitions
    function migrateLegacyData() {
      return window.dataService.getValue(LEGACY_STORAGE_KEY, { scopeType: "Default" }).then(function(legacyData) {
        if (!legacyData || legacyData.length === 0) {
          console.log("[TimeTracker] No legacy data to migrate");
          return Promise.resolve();
        }

        console.log("[TimeTracker] Migrating " + legacyData.length + " legacy entries...");

        // Group entries by month
        var entriesByMonth = {};
        legacyData.forEach(function(entry) {
          var key = TC.getStorageKeyForDate(entry.date);
          if (!entriesByMonth[key]) {
            entriesByMonth[key] = [];
          }
          entriesByMonth[key].push(entry);
        });

        // Save each month's entries
        var promises = Object.keys(entriesByMonth).map(function(key) {
          return window.dataService.setValue(key, entriesByMonth[key], { scopeType: "Default" });
        });

        // After migration, delete legacy data
        return Promise.all(promises).then(function() {
          console.log("[TimeTracker] Migration complete, deleting legacy data");
          return window.dataService.setValue(LEGACY_STORAGE_KEY, null, { scopeType: "Default" });
        });
      }, function(err) {
        console.log("[TimeTracker] No legacy data found");
        return Promise.resolve();
      });
    }

    // Get entries for a specific month
    function getEntriesForMonth(storageKey) {
      return window.dataService.getValue(storageKey, { scopeType: "Default" }).then(function(data) {
        return data || [];
      }, function(err) {
        return [];
      });
    }

    // Get all entries for the current work item (loads last 12 months)
    function getAllEntries() {
      var promises = [];
      var today = new Date();
      var monthKeys = [];

      // Load last 12 months to ensure we get all entries for this work item
      for (var i = 0; i < 12; i++) {
        var date = new Date(today.getFullYear(), today.getMonth() - i, 1);
        // Generate key directly from date object to avoid timezone issues
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var key = STORAGE_KEY_PREFIX + year + "_" + month;
        monthKeys.push(key);
        promises.push(getEntriesForMonth(key));
      }
      console.log("[TimeTracker] Loading data from months:", monthKeys);

      return Promise.all(promises).then(function(results) {
        var allEntries = [];
        results.forEach(function(monthEntries) {
          if (monthEntries.length > 0) {
            console.log("[TimeTracker] Found", monthEntries.length, "entries in a month");
          }
          allEntries = allEntries.concat(monthEntries);
        });
        console.log("[TimeTracker] Total entries across all months:", allEntries.length);
        return allEntries;
      });
    }

    // Opens the shared Log Time dialog with this work item locked in.
    function openLogTime() {
      if (loggingBlocked) {
        showMessage(TC.EPIC_BLOCKED_MSG, "error");
        return;
      }
      getWitClient().then(function(c) {
        return c.getWorkItem(workItemId, ["System.Title", "System.WorkItemType"]);
      }).then(function(wi) {
        var item = { id: workItemId, title: wi.fields["System.Title"], type: wi.fields["System.WorkItemType"] };
        TC.openAddEntryModal({
          dataService: window.dataService,
          witClientGetter: getWitClient,
          currentUser: currentUser,
          projectName: window.__projectName,
          initialItem: item,
          lockItem: true,
          onSaved: function() { showMessage("Time entry saved!", "success"); loadTimeEntries(); }
        });
      }, function(err) {
        showMessage("Error: " + (err.message || err), "error");
      });
    }

    function loadTimeEntries() {
      console.log("[TimeTracker] Loading time entries for work item:", workItemId);
      Promise.all([getAllEntries(), TC.refreshEditCutoff(window.dataService)]).then(function(res) {
        var entries = res[0];
        console.log("[TimeTracker] Loaded total entries from all months:", entries.length);
        var workItemEntries = entries.filter(function(e) {
          return e.workItemId === workItemId;
        });
        console.log("[TimeTracker] Entries for this work item:", workItemEntries.length);

        var listEl = document.getElementById("entriesList");
        var totalEl = document.getElementById("totalHours");

        if (workItemEntries.length === 0) {
          console.log("[TimeTracker] No entries to display");
          listEl.innerHTML = "<p class='text-muted'>No time entries yet.</p>";
          totalEl.style.display = "none";
          return;
        }

        // Sort by date descending
        workItemEntries.sort(function(a, b) {
          return new Date(b.date) - new Date(a.date);
        });

        var totalHours = workItemEntries.reduce(function(sum, e) {
          return sum + e.hours;
        }, 0);

        listEl.innerHTML = workItemEntries.map(function(e) {
          var canModify = e.userId === currentUser.id && !TC.isEntryLocked(e.date);
          return '<div class="time-entry-item">' +
            '<div class="entry-info">' +
              '<span class="entry-user">' + escapeHtml(e.userName) + '</span>' +
              '<span class="entry-date">' + e.date + '</span>' +
              (e.description ? '<span class="entry-description">' + escapeHtml(e.description) + '</span>' : '') +
            '</div>' +
            '<div style="display: flex; align-items: center; gap: 4px;">' +
              '<span class="entry-hours">' + e.hours + 'h</span>' +
              (canModify ? '<button class="icon-btn edit-btn" title="Edit" onclick="editEntry(\'' + e.id + '\')">' + EDIT_ICON + '</button>' : '') +
              (canModify ? '<button class="icon-btn delete-btn" title="Delete" onclick="deleteEntry(\'' + e.id + '\')">' + DELETE_ICON + '</button>' : '') +
            '</div>' +
          '</div>';
        }).join("");

        totalEl.textContent = "Total: " + totalHours.toFixed(2) + " hours";
        totalEl.style.display = "block";
      });
    }

    function deleteEntry(entryId) {
      if (!confirm("Delete this time entry?")) return;

      // Find the entry to get its date
      getAllEntries().then(function(entries) {
        var entry = entries.find(function(e) {
          return e.id === entryId;
        });

        if (!entry) {
          showMessage("Entry not found", "error");
          return;
        }
        if (!currentUser || entry.userId !== currentUser.id) {
          showMessage("You can only delete your own entries", "error");
          return;
        }

        return getWitClient().then(function(client) {
          return TC.deleteEntryById(window.dataService, entryId, entry.date, client);
        });
      }).then(function() {
        showMessage("Entry deleted", "success");
        loadTimeEntries();
      });
    }

    // Setup field observer for state changes
    function setupFieldObserver() {
      VSS.require(["VSS/Service", "TFS/WorkItemTracking/Services"], function(VSS_Service, WIT_Services) {
        WIT_Services.WorkItemFormService.getService().then(function(workItemFormService) {
          console.log("[TimeTracker] Field observer setup complete");
          window.workItemFormService = workItemFormService;
        });
      });
    }

    // Check if we should show the time nudge when state changes
    function checkForTimeNudge(newState) {
      // Check if state is "Done", "Closed", or "Resolved"
      var closedStates = ["Done", "Closed", "Resolved"];
      var stateLower = newState.toLowerCase();
      var isClosed = closedStates.some(function(s) {
        return s.toLowerCase() === stateLower;
      });

      if (!isClosed || loggingBlocked) {
        console.log("[TimeTracker] State not closed or logging blocked, skipping nudge");
        return;
      }

      console.log("[TimeTracker] Work item moved to closed state, checking for time entries...");

      // Check if there are any time entries for this work item
      getAllEntries().then(function(entries) {
        var workItemEntries = entries.filter(function(e) {
          return e.workItemId === workItemId;
        });

        if (workItemEntries.length === 0) {
          console.log("[TimeTracker] No time entries found, showing nudge");
          showNudgeBanner();
        } else {
          console.log("[TimeTracker] Time entries exist, no nudge needed");
        }
      });
    }

    // Show the gentle nudge banner
    function showNudgeBanner() {
      document.getElementById("nudgeBanner").style.display = "block";
      document.getElementById("app").scrollTo({ top: 0, behavior: "smooth" });
    }

    // Dismiss the nudge banner
    function dismissNudge() {
      document.getElementById("nudgeBanner").style.display = "none";
    }

    function editEntry(entryId) {
      getAllEntries().then(function(entries) {
        var entry = entries.find(function(e) { return e.id === entryId; });
        if (!entry) { showMessage('Entry not found', 'error'); return; }
        if (!currentUser || entry.userId !== currentUser.id) { showMessage('You can only edit your own entries', 'error'); return; }
        TC.openAddEntryModal({
          dataService: window.dataService,
          witClientGetter: getWitClient,
          currentUser: currentUser,
          projectName: window.__projectName,
          recentItems: [{ id: entry.workItemId, title: entry.workItemTitle || '(untitled)', type: null }],
          title: 'Edit Time Entry',
          saveLabel: 'Save',
          initialItem: { id: entry.workItemId, title: entry.workItemTitle || '(untitled)', type: null },
          initialHours: entry.hours,
          initialDate: entry.date,
          initialDesc: entry.description,
          entryId: entry.id,
          originalDate: entry.date,
          onSaved: function() { showMessage('Entry updated', 'success'); loadTimeEntries(); }
        });
      });
    }
  </script>
</body>
</html>
